name: CI - Validate database changes

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liquibase and Databricks Driver Manually
        run: |
          # 1. Descargar e instalar Liquibase 4.32.0 directamente
          wget -q https://github.com/liquibase/liquibase/releases/download/v4.32.0/liquibase-4.32.0.tar.gz
          mkdir -p liquibase_bin
          tar -xzf liquibase-4.32.0.tar.gz -C liquibase_bin
          echo "${GITHUB_WORKSPACE}/liquibase_bin" >> $GITHUB_PATH

          # 2. Descargar el driver JDBC oficial de Databricks directamente en su carpeta lib global
          mkdir -p ~/.liquibase/lib
          wget -q -O ~/.liquibase/lib/databricks-jdbc.jar https://repo1.maven.org/maven2/com/databricks/databricks-jdbc/2.6.35/databricks-jdbc-2.6.35.jar

      - name: Validate changelog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.sql \
            --driver=com.databricks.client.jdbc.Driver \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443/default;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH};ConnCatalog=${DATABRICKS_CATALOG}" \
            --username=token \
            --password="${DATABRICKS_TOKEN}" \
            validate

      - name: Show pending changesets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.sql \
            --driver=com.databricks.client.jdbc.Driver \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443/default;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH};ConnCatalog=${DATABRICKS_CATALOG}" \
            --username=token \
            --password="${DATABRICKS_TOKEN}" \
            status --verbose

      - name: Preview SQL
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.sql \
            --driver=com.databricks.client.jdbc.Driver \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443/default;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH};ConnCatalog=${DATABRICKS_CATALOG}" \
            --username=token \
            --password="${DATABRICKS_TOKEN}" \
            update-sql