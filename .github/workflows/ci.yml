name: CI - Validate database changes

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liquibase and Databricks Driver
        run: |
          wget -q https://github.com/liquibase/liquibase/releases/download/v4.29.2/liquibase-4.29.2.tar.gz
          mkdir liquibase_bin
          tar -xzf liquibase-4.29.2.tar.gz -C liquibase_bin
          echo "${GITHUB_WORKSPACE}/liquibase_bin" >> $GITHUB_PATH
          
          # Descargar el driver JDBC oficial de Databricks en la carpeta lib de Liquibase
          wget -q https://github.com/databricks/databricks-jdbc/releases/download/v2.6.35/DatabricksJDBC42.zip
          unzip -q DatabricksJDBC42.zip
          mkdir -p liquibase_bin/lib
          cp DatabricksJDBC42.jar liquibase_bin/lib/

      - name: Validate changelog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.sql \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443/default;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH};ConnCatalog=${DATABRICKS_CATALOG}" \
            --username=token \
            --password="${DATABRICKS_TOKEN}" \
            validate

      - name: Show pending changesets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.sql \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443/default;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH};ConnCatalog=${DATABRICKS_CATALOG}" \
            --username=token \
            --password="${DATABRICKS_TOKEN}" \
            status --verbose

      - name: Preview SQL
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          liquibase \
            --changelog-file=changelog/db.changelog-master.sql \
            --url="jdbc:databricks://${DATABRICKS_HOST}:443/default;AuthMech=3;httpPath=${DATABRICKS_HTTP_PATH};ConnCatalog=${DATABRICKS_CATALOG}" \
            --username=token \
            --password="${DATABRICKS_TOKEN}" \
            update-sql