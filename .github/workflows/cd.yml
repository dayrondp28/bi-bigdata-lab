name: CD - Deploy database changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v3.0.0
        with:
          version: '4.32.0'
          edition: 'community'

      - name: Download Liquibase Databricks Extension
        run: |
          curl -sL "https://repo1.maven.org/maven2/org/liquibase/ext/liquibase-databricks/4.32.0/liquibase-databricks-4.32.0.jar" -o lib/liquibase-databricks.jar

     